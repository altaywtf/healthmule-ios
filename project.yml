name: HealthMule

options:
  bundleIdPrefix: dev.uinaf
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  HealthMuleCore:
    path: .
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  HealthMule:
    type: application
    platform: iOS
    sources:
      - path: HealthMuleApp
        excludes:
          - Resources
      - path: HealthMuleApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: HealthMuleApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HealthMuleCore
        product: HealthMuleCore
      - package: HealthMuleCore
        product: HealthMuleCompanion
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: HealthMuleWatch
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMULE_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: HealthMuleApp/Resources/HealthMule.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: $(HEALTHMULE_DEVELOPMENT_TEAM)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: HealthMuleApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthMule
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Google OAuth
            CFBundleURLSchemes:
              - $(HEALTHMULE_GOOGLE_REDIRECT_SCHEME)
        NSHealthShareUsageDescription: HealthMule reads only the fitness metrics you select and exports normalized daily summaries to your Google Drive.
        NSHealthUpdateUsageDescription: HealthMule does not write to or modify your Health data; it only reads the fitness metrics you select for export to your Google Drive.
        UIRequiredDeviceCapabilities:
          - healthkit
        GIDClientID: $(HEALTHMULE_GOOGLE_CLIENT_ID)
        BGTaskSchedulerPermittedIdentifiers:
          - dev.uinaf.healthmule.refresh
        UIBackgroundModes:
          - fetch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  HealthMuleWatch:
    type: application
    platform: watchOS
    sources:
      - path: HealthMuleWatchApp
        excludes:
          - Resources
      - path: HealthMuleWatchApp/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: HealthMuleCore
        product: HealthMuleCompanion
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMULE_BUNDLE_IDENTIFIER).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(HEALTHMULE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HealthMule
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(HEALTHMULE_BUNDLE_IDENTIFIER)
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  HealthMuleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthMuleTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: HealthMule
      - package: HealthMuleCore
        product: HealthMuleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.uinaf.healthmule.tests
        GENERATE_INFOPLIST_FILE: YES

  HealthMuleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthMuleUITests
    dependencies:
      - target: HealthMule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.uinaf.healthmule.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HealthMule

schemes:
  HealthMule:
    build:
      targets:
        HealthMule: all
        HealthMuleWatch: all
        HealthMuleTests: [test]
        HealthMuleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HealthMuleTests
        - name: HealthMuleUITests

  HealthMuleWatch:
    build:
      targets:
        HealthMuleWatch: all
    run:
      config: Debug
