[extend]
useDefault = true

# The TestFlight validator greps for the PEM header literals, so `private-key`
# reads the shell between them as key material. Allow only that shape in that
# file: the condition is AND, and the regex matches the finding's secret rather
# than its line, so a key sharing a line with a header is still reported.
[[allowlists]]
description = "TestFlight configuration validator asserts on PEM header strings"
condition = "AND"
paths = ['''scripts/ci/validate-testflight-configuration\.sh$''']
regexes = ['''^-----BEGIN PRIVATE KEY-----" <<<"\$\{[A-Z_]+\}" \|\|\n  fail "[^"]+"\ngrep -Fq -- "-----END PRIVATE KEY-----$''']
