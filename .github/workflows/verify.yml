name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select compile lane
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      compile: ${{ steps.filter.outputs.compile }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select app compile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            compile:
              - '.github/workflows/verify.yml'
              - 'Config/**'
              - 'HealthMule.xcodeproj/**'
              - 'HealthMuleApp/**'
              - 'HealthMuleShared/**'
              - 'HealthMuleWatchApp/**'
              - 'Sources/**'
              - 'Makefile'
              - 'Package.resolved'
              - 'Package.swift'
              - 'project.yml'
              - 'scripts/**'

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fingerprint Swift toolchain
        id: swift-toolchain
        run: |
          swift_binary="$(command -v swift)"
          echo "binary=${swift_binary}"
          echo "hash=$(sha256sum "${swift_binary}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Restore Swift build cache
        id: swift-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: verify-swift-build-v1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Makefile', 'scripts/swift.sh') }}
          restore-keys: |
            verify-swift-build-v1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-

      - name: Run cached verification
        if: steps.swift-build-cache.outputs.cache-hit == 'true'
        env:
          HEALTHMULE_MODULE_CACHE: ${{ github.workspace }}/.build/module-cache
        run: make verify-cached

      - name: Build and run verification
        if: steps.swift-build-cache.outputs.cache-hit != 'true'
        env:
          HEALTHMULE_MODULE_CACHE: ${{ github.workspace }}/.build/module-cache
        run: make verify

  compile:
    name: Compile app and Watch app
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fingerprint Xcode toolchain
        id: xcode-toolchain
        run: |
          xcode_version="$(./scripts/xcodebuild.sh -version)"
          printf '%s\n' "${xcode_version}"
          version_hash="$(printf '%s' "${xcode_version}" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "hash=${version_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Xcode dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/toolchain
            .artifacts/xcodegen
            .artifacts/DerivedData/SourcePackages
            HealthMule.xcodeproj
            HealthMuleApp/Resources/Info.plist
          key: verify-xcode-dependencies-v3-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-toolchain.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved', 'project.yml', 'scripts/install-xcodegen.sh') }}

      # make verify only parses Swift. This is the gate that type checks the
      # iOS app and the embedded Watch app.
      - name: Build unsigned app and Watch app
        run: make build
